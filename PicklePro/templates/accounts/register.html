{% extends "base.html" %}

{% block title %}Đăng Ký Thành Viên - PicklePro{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
    <div class="bg-white rounded-3xl p-8 sm:p-10 shadow-lg border border-slate-100 w-full max-w-lg">
        
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-emerald-500 text-white flex items-center justify-center text-2xl mx-auto mb-4 shadow-lg shadow-emerald-500/20">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900">Đăng Ký Tài Khoản Mới</h1>
            <p class="text-xs text-slate-500 mt-1">Trở thành thành viên câu lạc bộ PicklePro để hưởng trọn ưu đãi</p>
        </div>

        <form method="POST" action="{% url 'register' %}" class="space-y-4">
            {% csrf_token %}
            
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Họ đệm</label>
                    <input type="text" name="last_name" placeholder="Ví dụ: Nguyễn" class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Tên</label>
                    <input type="text" name="first_name" placeholder="Ví dụ: Văn An" class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Tên đăng nhập <span class="text-red-500">*</span></label>
                <div class="relative">
                    <i class="fa-solid fa-at absolute left-4 top-3 text-slate-400 text-sm"></i>
                    <input type="text" name="username" required placeholder="Chọn tên đăng nhập viết liền không dấu..." class="w-full pl-11 pr-4 py-2.5 rounded-2xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Số điện thoại <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <i class="fa-solid fa-phone absolute left-4 top-3 text-slate-400 text-sm"></i>
                        <input type="tel" name="phone_number" required placeholder="0901234567" class="w-full pl-11 pr-4 py-2.5 rounded-2xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-4 top-3 text-slate-400 text-sm"></i>
                        <input type="email" name="email" placeholder="email@gmail.com" class="w-full pl-11 pr-4 py-2.5 rounded-2xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Mật khẩu <span class="text-red-500">*</span></label>
                    <input type="password" name="password" required placeholder="Tối thiểu 6 ký tự" class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Nhập lại mật khẩu <span class="text-red-500">*</span></label>
                    <input type="password" name="confirm_password" required placeholder="Nhập lại chính xác" class="w-full px-4 py-2.5 rounded-2xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm shadow-lg shadow-emerald-600/30 transition-all hover:scale-[1.01] active:scale-[0.99] mt-2">
                Đăng Ký Tài Khoản
            </button>
        </form>

        <div class="text-center mt-6 pt-6 border-t border-slate-100 text-xs text-slate-500">
            Đã có tài khoản rồi? 
            <a href="{% url 'login' %}" class="font-bold text-emerald-600 hover:text-emerald-700 ml-1">Đăng nhập ngay</a>
        </div>

    </div>
</div>
{% endblock %}
