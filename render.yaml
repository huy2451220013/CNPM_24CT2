services:
  - type: web
    name: picklepro-cnpm
    runtime: python
    plan: free
    rootDir: PicklePro
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && python manage.py seed_data --if-empty && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: USE_SQLITE
        value: "true"
      - key: DJANGO_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
